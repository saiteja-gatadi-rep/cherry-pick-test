# .github/workflows/cherry-pick.yml
#
# Simulates the Azure DevOps "Cherry-pick" button on github.com.
#
# Usage (comment on a MERGED pull request):
#   /cherry-pick release/v1.2
#   /cherry-pick release/v1.2 release/v2.0 hotfix/aug   <- several destinations at once
#   /cherry release/v1.2          (alias)
#   /cherry_pick release/v1.2     (alias)
#
# What it does:
#   1. Reads the destination branch(es) you typed in the comment.
#   2. Creates a new branch off each destination.
#   3. Cherry-picks the PR's changes as ONE squashed commit
#      (a 3-commit PR becomes a single commit).
#   4. Opens a PR from that new branch -> destination branch.
#   5. STOPS. It never merges. You review and merge the PR yourself.
#
# Works for anyone with access to the repo. No PAT or extra setup needed.

name: Cherry-pick (button)

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  cherry-pick:
    # Run only on PR comments starting with /cherry (covers /cherry-pick and /cherry_pick too)
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/cherry')
    runs-on: ubuntu-latest
    steps:
      # eyes reaction so the developer sees the "button" was pressed
      - name: Acknowledge command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            "/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content='eyes' >/dev/null 2>&1 || true

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to cherry-pick

      - name: Squash-cherry-pick into each destination and open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          # Pass comment via env (NOT inline) to avoid shell injection
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ---- destination branch(es) from the comment (first line only) ----
          TARGETS=$(printf '%s' "$COMMENT_BODY" | head -n1 \
            | sed -E 's@^[[:space:]]*/(cherry-pick|cherry_pick|cherry)[[:space:]]*@@' \
            | xargs || true)
          if [ -z "${TARGETS:-}" ]; then
            gh pr comment "$PR_NUMBER" \
              --body "Tell me where to cherry-pick: \`/cherry-pick <branch> [branch2 ...]\`"
            exit 1
          fi

          # ---- PR must be merged so its changes exist ----
          MERGED=$(gh pr view "$PR_NUMBER" --json mergedAt -q '.mergedAt' || true)
          if [ -z "${MERGED:-}" ] || [ "$MERGED" = "null" ]; then
            gh pr comment "$PR_NUMBER" \
              --body "This PR isn't merged yet. Cherry-pick runs after merge, like the Azure button."
            exit 1
          fi

          PR_TITLE=$(gh pr view "$PR_NUMBER" --json title    -q '.title')
          BASE_REF=$(gh pr view "$PR_NUMBER" --json baseRefName -q '.baseRefName')

          # ---- grab the PR's OWN commits (this ref survives merge + branch delete) ----
          git fetch origin "refs/pull/${PR_NUMBER}/head:pr-${PR_NUMBER}-head"
          git fetch origin "$BASE_REF"
          PR_HEAD=$(git rev-parse "pr-${PR_NUMBER}-head")
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" "$PR_HEAD")
          # MERGE_BASE..PR_HEAD = exactly the commits this PR introduced (1, 3, or N)

          for TARGET in $TARGETS; do
            echo "::group::Cherry-pick #$PR_NUMBER -> $TARGET"

            if ! git fetch origin "$TARGET":"refs/remotes/origin/$TARGET" 2>/dev/null; then
              gh pr comment "$PR_NUMBER" --body "Destination branch \`$TARGET\` not found. Skipped."
              echo "::endgroup::"; continue
            fi

            SAFE_TARGET=${TARGET//\//-}
            NEW_BRANCH="cherry-pick/pr-${PR_NUMBER}-to-${SAFE_TARGET}"
            git checkout -B "$NEW_BRANCH" "origin/$TARGET"

            # Apply ALL of the PR's commits as staged changes, then ONE commit = squashed.
            if git cherry-pick -n "${MERGE_BASE}..${PR_HEAD}"; then
              git commit -m "${PR_TITLE} (cherry-pick #${PR_NUMBER})"
              git push -f origin "$NEW_BRANCH"
              URL=$(gh pr create \
                --base "$TARGET" \
                --head "$NEW_BRANCH" \
                --title "[cherry-pick -> $TARGET] $PR_TITLE" \
                --body "Squashed cherry-pick of #${PR_NUMBER} onto \`$TARGET\` (single commit). Review and merge when ready.")
              gh pr comment "$PR_NUMBER" --body "Cherry-pick PR for \`$TARGET\` is ready: $URL"
            else
              git cherry-pick --abort 2>/dev/null || true
              git reset --hard "origin/$TARGET"
              gh pr comment "$PR_NUMBER" \
                --body "Cherry-pick into \`$TARGET\` hit a conflict and needs a manual resolve. Nothing was pushed."
            fi
            echo "::endgroup::"
          done
